<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dually Dagobert's Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">💰 Dually Dagobert's Expense Tracker - Dashboard</span>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Dashboard</h1>
        <p class="lead">Track your expenses and manage your budget with ease.</p>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card text-white bg-info mb-3">
                    <div class="card-header">Total Expenses</div>
                    <div class="card-body">
                        <h2 class="card-title" id="totalExpenses">Loading...</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-header">Total Amount</div>
                    <div class="card-body">
                        <h2 class="card-title" id="totalAmount">Loading...</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-header">Average Amount</div>
                    <div class="card-body">
                        <h2 class="card-title" id="averageAmount">Loading...</h2>
                    </div>
                </div>
            </div>
        </div>
        
        <a href="/expenses" class="btn btn-primary btn-lg">Manage Expenses</a>
    </div>

    <script>
        // Fetch dashboard data
        fetch('/api/dashboard')
            .then(response => response.json())
            .then(data => {
                document.getElementById('totalExpenses').textContent = data.totalExpenses || 0;
                document.getElementById('totalAmount').textContent = '$' + (data.totalAmount || 0).toFixed(2);
                document.getElementById('averageAmount').textContent = '$' + (data.averageAmount || 0).toFixed(2);
            })
            .catch(err => console.error('Error loading dashboard:', err));
    </script>
</body>
</html>
